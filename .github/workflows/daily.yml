# Refresh 24/11/2026
name: Docker (Daily)

# 03:30 UTC daily
on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # httpd-tls/rocky8
      - name: Build/push (httpd-tls/rocky8)
        uses: docker/build-push-action@v7
        with:
          context: ./httpd-tls/rocky8
          platforms: linux/amd64
          push: true
          tags: ghcr.io/cropgeeks/httpd-tls:rocky8
      
      # httpd/rocky8
      - name: build/push (httpd:rocky8)
        uses: docker/build-push-action@v3
        with:
          context: httpd/rocky8
          platforms: linux/amd64
          push: true
          tags: ghcr.io/cropgeeks/httpd:rocky8

      # lindamp
      - name: Build/push (lindamp)
        uses: docker/build-push-action@v7
        with:
          context: ./lindamp
          platforms: linux/amd64
          push: true
          tags: ghcr.io/cropgeeks/lindamp
      
      # flapjack-ws/9-jre11
      - name: Build/push (flapjack-ws/9-jre11)
        uses: docker/build-push-action@v7
        with:
          context: ./flapjack-ws/9-jre11
          platforms: linux/amd64
          push: true
          tags: ghcr.io/cropgeeks/flapjack-ws/9-jre11

  del_runs:
    runs-on: ubuntu-latest

    permissions:
      actions: write
      contents: read

    steps:
      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 30
          keep_minimum_runs: 6
